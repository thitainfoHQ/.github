<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Thita Info — Software that ships. Web, mobile and AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#E3C547" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2D45C"/>
      <stop offset="1" stop-color="#E39B3A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- eyebrow -->
  <g transform="translate(72,78)">
    <circle cx="6" cy="-5" r="5" fill="#3DDC84" class="pulse"/>
    <text x="20" y="0" class="t" font-size="16" letter-spacing="3" fill="#9A9AA5">THITA INFO · SOFTWARE STUDIO</text>
  </g>

  <!-- headline -->
  <text x="70" y="168" class="t" font-size="72" font-weight="800" fill="#F5F5F7" letter-spacing="-2">Software that ships<tspan fill="url(#accent)">.</tspan></text>
  <text x="72" y="222" class="t" font-size="30" font-weight="500" fill="#B4B4BE">Web, mobile and AI<tspan fill="#E3C547" class="cursor">_</tspan></text>

  <!-- footer line -->
  <text x="72" y="286" class="t" font-size="16" fill="#6E6E78">Built in India  ·  Sold &amp; supported from Canada  ·  thitainfo.com</text>

  <!-- code card -->
  <g transform="translate(800,92)">
    <rect width="330" height="170" rx="14" fill="#111116" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F57"/><circle cx="40" cy="22" r="5" fill="#FEBC2E"/><circle cx="58" cy="22" r="5" fill="#28C840"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
      <text x="22" y="62"><tspan fill="#C792EA">const</tspan><tspan fill="#E6E6EA"> team = {</tspan></text>
      <text x="40" y="88"><tspan fill="#82AAFF">web</tspan><tspan fill="#E6E6EA">: </tspan><tspan fill="#C3E88D">"Next.js"</tspan><tspan fill="#E6E6EA">,</tspan></text>
      <text x="40" y="112"><tspan fill="#82AAFF">mobile</tspan><tspan fill="#E6E6EA">: </tspan><tspan fill="#C3E88D">"RN · Flutter"</tspan><tspan fill="#E6E6EA">,</tspan></text>
      <text x="40" y="136"><tspan fill="#82AAFF">ai</tspan><tspan fill="#E6E6EA">: </tspan><tspan fill="#C3E88D">"RAG · Agents"</tspan><tspan fill="#E6E6EA">,</tspan></text>
      <text x="22" y="158" fill="#E6E6EA">}<tspan fill="#E3C547" class="cursor">▍</tspan></text>
    </g>
  </g>
</svg>
